{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="container py-5 text-center cn-empty-state" style="min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <i class="bi bi-map" style="font-size:5rem;color:#2563EB;"></i>
  <h1 class="display-4 fw-800 mt-3" style="font-weight:800;">404</h1>
  <h3 class="fw-bold">Page Not Found</h3>
  <p class="text-muted">The page you are looking for doesn't exist or has been moved.</p>
  <a href="{% url 'core:home' %}" class="btn btn-primary mt-2">Back to Home</a>
</div>
{% endblock %}
