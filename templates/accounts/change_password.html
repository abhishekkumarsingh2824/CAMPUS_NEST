{% extends 'base.html' %}
{% block title %}Change Password — CampusNest{% endblock %}

{% block content %}
<div class="cn-page-header">
  <div class="container">
    <h1><i class="bi bi-key me-2"></i>Change Password</h1>
  </div>
</div>
<div class="container py-4">
  <div class="cn-form-card">
    <form method="POST" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Current Password *</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password *</label>
        <input type="password" name="new_password" class="form-control" required minlength="8">
        <div class="form-text">Minimum 8 characters</div>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm New Password *</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-lock me-1"></i>Update Password</button>
        <a href="{% url 'accounts:edit_profile' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
