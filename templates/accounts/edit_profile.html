{% extends 'base.html' %}
{% block title %}Edit Profile — CampusNest{% endblock %}

{% block content %}
<div class="cn-page-header">
  <div class="container">
    <h1><i class="bi bi-person-gear me-2"></i>Edit Profile</h1>
    <p>Update your personal information</p>
  </div>
</div>

<div class="container py-4">
  <div class="row g-4 justify-content-center">
    <div class="col-lg-7">
      <div class="cn-info-card">
        <form method="POST" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Full Name *</label>
            <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled>
            <div class="form-text">Email cannot be changed.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="tel" name="phone" class="form-control" value="{{ user.phone }}" placeholder="10-digit mobile">
          </div>
          <div class="mb-3">
            <label class="form-label">College / University</label>
            <input type="text" name="college" class="form-control" value="{{ user.college }}">
          </div>
          <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control" value="{{ user.city }}">
          </div>
          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Save Changes</button>
            <a href="{% url 'accounts:change_password' %}" class="btn btn-outline-secondary"><i class="bi bi-key me-1"></i>Change Password</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
